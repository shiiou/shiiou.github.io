(function(root){
const stages=[['Petites pousses',4,2,2,'classic','Un premier pas, tout en douceur.'],['Les lucioles',4,2,2,'even','Les cases P accueillent un nombre pair.'],['Duos malins',4,2,2,'sum','Deux voisins, une somme à retrouver.'],['Le grand jardin',6,2,3,'classic','Six chiffres pour élargir son horizon.'],['La forêt des liens',6,2,3,'sum','Additionne, observe, puis déduis.'],['Les étoiles',9,3,3,'even','Le grand sudoku, avec des repères pairs.']];
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function candidates(p,b,i){if(b[i])return [];const n=p.n,r=Math.floor(i/n),c=i%n,out=[];for(let v=1;v<=n;v++){
 if(p.even.includes(i)&&v%2)continue;let ok=true;
 for(let j=0;j<n;j++)if(b[r*n+j]===v||b[j*n+c]===v)ok=false;
 for(let y=r-r%p.h;y<r-r%p.h+p.h;y++)for(let x=c-c%p.w;x<c-c%p.w+p.w;x++)if(b[y*n+x]===v)ok=false;
 for(const d of p.duos)if(d.a===i||d.b===i){let o=d.a===i?d.b:d.a;if(b[o]?b[o]+v!==d.total:d.total-v<1||d.total-v>n||d.total-v===v)ok=false;}
 if(ok)out.push(v);
}return out;}
function count(p,board,limit=2){const b=board.slice();let total=0;function walk(){let best=-1,opts=[];for(let i=0;i<b.length;i++)if(!b[i]){let a=candidates(p,b,i);if(!a.length)return;if(best<0||a.length<opts.length){best=i;opts=a;}if(a.length===1)break;}if(best<0){total++;return;}for(const v of opts){b[best]=v;walk();if(total>=limit)break;}b[best]=0;}walk();return total;}
function single(p,b){for(let i=0;i<b.length;i++)if(!b[i]){const a=candidates(p,b,i);if(a.length===1)return {i,v:a[0]};}return null;}
function logical(p,b){b=b.slice();while(b.includes(0)){let s=single(p,b);if(!s)return false;b[s.i]=s.v;}return true;}
function generate(level){if(!Number.isInteger(level)||level<1||level>60)throw Error('Invalid level');const stage=Math.floor((level-1)/10),[name,n,h,w,mode]=stages[stage],r=rng(level*7919),digits=shuffle(Array.from({length:n},(_,i)=>i+1),r);
 const rows=shuffle(Array.from({length:n/h},(_,i)=>i),r).flatMap(g=>shuffle(Array.from({length:h},(_,i)=>g*h+i),r));
 const cols=shuffle(Array.from({length:n/w},(_,i)=>i),r).flatMap(g=>shuffle(Array.from({length:w},(_,i)=>g*w+i),r));
 const solution=rows.flatMap(y=>cols.map(x=>digits[(y*w+Math.floor(y/h)+x)%n]));

 if(mode==='sum')for(let y=0;y<n;y++){let x=Math.floor(r()*(n-1));let a=y*n+x;p.duos.push({a,b:a+1,total:solution[a]+solution[a+1]});}

'Idioma','{n} / 60 concluídos','Um pequeno desafio, um grande sorriso','A lógica ganha vida.','Números, conexões e descobertas. Um jardim de desafios para todas as idades.','Jogar · Nível {n}','Continuar meu jogo','No seu ritmo · Dicas grátis · Salvamento automático','Sua aventura','Como jogar','Clássico','Casas pares','Duplas de somas','Conclua a etapa anterior','Etapa {n} de 6','Nível {n}','{n} níveis','Cada nível concluído libera o próximo. Você pode repetir os níveis concluídos.','Um número. Um lugar.',
'Cada número aparece uma única vez em cada linha, coluna e bloco de borda grossa. Use os números de 1 a 4, 6 ou 9, conforme a grade.','Uma casa marcada P deve conter um número par: 2, 4, 6 ou 8.','As duas casas vizinhas com a mesma letra devem somar o total indicado. Por exemplo, A = 5 pode ser 1 + 4 ou 2 + 3.','Escolha uma casa e depois um número. Você pode apagar, desfazer ou pedir uma dica explicada. Sem cronômetro e sem vidas a perder.','Entendi','Escolha uma casa vazia e depois um número.','Este número é uma pista fixa.','Sua vez.','Este número não respeita a linha, coluna, bloco ou pista. Tente novamente!','Muito bem, continue observando!','Última jogada desfeita.','Esta escolha impede completar a grade. Apague esta casa e confira as pistas.','A grade já está preenchida.','Linha {r}, coluna {c}: apenas {v} é possível após eliminar os números da linha, coluna e bloco e aplicar as pistas extras.','Apagar','Desfazer','Dica','Grade de sudoku','Linha','Coluna','Vazia','As casas P são pares: {values}.','Duplas vizinhas','Etapa concluída','Uma nova descoberta','Muito bem!','Nível {n} concluído.','Um novo jardim de desafios espera por você.','Cada pequeno passo desenvolve sua lógica.','Os 60 desafios estão no seu jardim.','Explorar a próxima etapa','Próximo nível','Início','Ver minhas etapas','PUBLICIDADE · DEMONSTRAÇÃO',

'Taal','{n} / 60 voltooid','Een kleine uitdaging, een grote glimlach','Logica komt tot leven.','Getallen, verbanden en ontdekkingen. Een puzzeltuin voor jong en oud.','Spelen · Level {n}','Mijn spel hervatten','Jouw tempo · Gratis hints · Automatisch opslaan','Jouw avontuur','Spelregels','Klassiek','Even vakjes','Somparen','Voltooi de vorige etappe','Etappe {n} van 6','Level {n}','{n} levels','Elk voltooid level opent het volgende. Je kunt voltooide levels opnieuw spelen.','Eén getal. Eén plek.',
'Elk getal komt precies één keer voor in elke rij, kolom en elk blok met een dikke rand. Gebruik de getallen van 1 tot 4, 6 of 9, afhankelijk van het rooster.','Een vakje met P moet een even getal bevatten: 2, 4, 6 of 8.','De twee aangrenzende vakjes met dezelfde letter moeten samen het aangegeven totaal vormen. A = 5 kan bijvoorbeeld 1 + 4 of 2 + 3 zijn.','Kies een vakje en dan een getal. Wis, maak een zet ongedaan of vraag een hint met uitleg. Geen tijdslimiet en geen levens om te verliezen.','Begrepen','Kies een leeg vakje en dan een getal.','Dit getal is een vaste aanwijzing.','Jij bent aan de beurt.','Dit getal past niet bij de rij, kolom, het blok of een aanwijzing. Probeer opnieuw!','Goed gedaan, blijf kijken!','Laatste zet ongedaan gemaakt.','Met deze keuze kun je het rooster niet afmaken. Wis dit vakje en bekijk de aanwijzingen.','Het rooster is al vol.','Rij {r}, kolom {c}: alleen {v} is mogelijk na het uitsluiten van de getallen in de rij, kolom en het blok en het toepassen van extra aanwijzingen.','Wissen','Ongedaan','Hint','Sudokurooster','Rij','Kolom','Leeg','P-vakjes zijn even: {values}.','Aangrenzende paren','Etappe voltooid','Een nieuwe ontdekking','Goed gedaan!','Level {n} voltooid.','Een nieuwe puzzeltuin wacht op je.','Met elk stapje groeit je logisch inzicht.','Alle 60 puzzels staan in je tuin.','Ontdek de volgende etappe','Volgend level','Start','Mijn etappes bekijken','ADVERTENTIE · DEMO',

'Każda liczba występuje tylko raz w każdym wierszu, kolumnie i bloku z grubą ramką. Używaj liczb od 1 do 4, 6 lub 9, zależnie od planszy.','Pole oznaczone P musi zawierać liczbę parzystą: 2, 4, 6 lub 8.','Dwa sąsiadujące pola z tą samą literą muszą dać wskazaną sumę. Na przykład A = 5 to 1 + 4 lub 2 + 3.','Wybierz pole, a potem liczbę. Możesz wymazać, cofnąć ruch lub poprosić o podpowiedź z wyjaśnieniem. Bez limitu czasu i utraty żyć.','Rozumiem','Wybierz puste pole, a potem liczbę.','Ta liczba jest stałą wskazówką.','Twój ruch.','Ta liczba nie pasuje do wiersza, kolumny, bloku lub wskazówki. Spróbuj ponownie!','Dobra robota, obserwuj dalej!','Cofnięto ostatni ruch.','Ten wybór uniemożliwia ukończenie planszy. Wymaż to pole i sprawdź wskazówki.','Plansza jest już pełna.','Wiersz {r}, kolumna {c}: możliwe jest tylko {v} po wykluczeniu liczb z wiersza, kolumny i bloku oraz zastosowaniu dodatkowych wskazówek.','Wymaż','Cofnij','Podpowiedź','Plansza sudoku','Wiersz','Kolumna','Puste','Pola P są parzyste: {values}.','Sąsiadujące pary','Etap ukończony','Nowe odkrycie','Brawo!','Poziom {n} ukończony.','Czeka na ciebie nowy ogród zagadek.','Każdy mały krok rozwija twoją logikę.','Wszystkie 60 zagadek są w twoim ogrodzie.','Odkryj następny etap','Następny poziom','Strona główna','Zobacz moje etapy','REKLAMA · DEMO',

for(const [code,values] of Object.entries(data)){if(values.length!==keys.length)throw Error(code+': '+values.length+' / '+keys.length);data[code]=Object.fromEntries(keys.map((k,i)=>[k,values[i]]));}
const themeLabels={fr:['Apparence','Clair','Sombre'],en:['Appearance','Light','Dark'],es:['Apariencia','Claro','Oscuro'],de:['Darstellung','Hell','Dunkel'],it:['Aspetto','Chiaro','Scuro'],pt:['Aparência','Claro','Escuro'],nl:['Weergave','Licht','Donker'],pl:['Wygląd','Jasny','Ciemny'],ru:['Оформление','Светлое','Тёмное'],ar:['المظهر','فاتح','داكن'],hi:['रूप','हल्का','गहरा'],zh:['外观','浅色','深色']};
for(const [code,labels] of Object.entries(themeLabels))['theme','light','dark'].forEach((key,i)=>data[code][key]=labels[i]);
keys.push('theme','light','dark');
let lang='fr';try{const saved=localStorage.getItem('shiidoku-language');const detected=(navigator.language||'fr').split('-')[0];lang=data[saved]?saved:data[detected]?detected:'en';}catch(e){}
function t(key,params={}){const value=data[lang][key]??data.fr[key];if(typeof value!=='string')return value;return value.replace(/\{(\w+)\}/g,(_,k)=>String(params[k]??'{'+k+'}'));}
function apply(){if(typeof document!=='undefined'){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title='Shiidoku · '+t('adventure');}if(typeof window!=='undefined'&&window.Android?.setTranslations)window.Android.setTranslations(JSON.stringify({...data[lang],locale:lang}));}
function setLanguage(code){if(!data[code])return;lang=code;try{localStorage.setItem('shiidoku-language',code);}catch(e){}apply();}
const api={data,names,keys,t,apply,setLanguage,get language(){return lang;}};

</script><script>const E=Shiidoku,L=I18n,t=L.t,app=document.getElementById('app');
let saved={done:[],active:null};
try{let s=JSON.parse(localStorage.getItem('shiidoku-v1'));if(s&&Array.isArray(s.done)){saved.done=[...new Set(s.done.filter(n=>Number.isInteger(n)&&n>0&&n<=60))];saved.active=s.active;}}catch(e){}
let p,b,selected=-1,history=[],screen='home',currentStage=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tx=(key,args)=>esc(t(key,args));
function persist(){try{localStorage.setItem('shiidoku-v1',JSON.stringify(saved));}catch(e){}}
function ads(place){if(window.Android)Android.setAdPlacement(place);}
function changeLanguage(code){L.setLanguage(code);if(screen==='game')draw();else if(screen==='levels')levels(currentStage);else if(screen==='rules')rules();else if(screen==='win')drawWin();else home();}

let theme='light';
try{const choice=localStorage.getItem('shiidoku-theme');theme=['light','dark'].includes(choice)?choice:(window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='dark'?'#111e1b':'#f7f7ed';if(window.Android?.setTheme)Android.setTheme(theme);}
function changeTheme(value){if(!['light','dark'].includes(value))return;theme=value;try{localStorage.setItem('shiidoku-theme',value);}catch(e){}applyTheme();}
function themeControl(){return `<label class="theme-picker">◐ ${tx('theme')} <select aria-label="${tx('theme')}" onchange="changeTheme(this.value)"><option value="light" ${theme==='light'?'selected':''}>${tx('light')}</option><option value="dark" ${theme==='dark'?'selected':''}>${tx('dark')}</option></select></label>`;}

function header(back=false){return `<header class="top"><${back?'button onclick="home()"':'div'} class="brand">${back?'← ':''}Shiidoku<span style="color:#89a35a">.</span></${back?'button':'div'}><span class="pill">${tx('completed',{n:saved.done.length})}</span></header><label class="language-picker">🌐 ${tx('language')} <select aria-label="${tx('language')}" onchange="changeLanguage(this.value)">${Object.entries(L.names).map(([code,name])=>`<option value="${code}" ${code===L.language?'selected':''}>${name}</option>`).join('')}</select></label>${themeControl()}`;}
function advert(){return '';}
function stageName(i){return esc(t('stages')[i]);}
function home(){screen='home';ads('home');let next=Array.from({length:60},(_,i)=>i+1).find(i=>!saved.done.includes(i))||60;let active=saved.active?.level,canResume=Number.isInteger(active)&&active>=1&&active<=60&&(active===1||saved.done.includes(active-1)||saved.done.includes(active));app.innerHTML=header()+`<section class="hero"><div class="eyebrow">${tx('tagline')}</div><h1>${tx('headline')}</h1><p>${tx('intro')}</p><button class="primary wide" onclick="start(${canResume?active:next})">${canResume?tx('resume'):tx('play',{n:next})} →</button><div class="foot">${tx('comfort')}</div></section><div class="section"><h2>${tx('adventure')}</h2><button class="secondary" onclick="rules()">${tx('rules')}</button></div><div class="cards">${E.stages.map((s,i)=>{let done=saved.done.filter(l=>Math.floor((l-1)/10)===i).length,open=i===0||saved.done.includes(i*10);return `<button class="card" ${open?'':'disabled'} onclick="levels(${i})"><span class="icon">${['✿','☼','∞','♧','◇','☆'][i]}</span><strong>${stageName(i)}</strong><small><bdi>${s[1]} × ${s[1]}</bdi> · ${tx(s[4])}</small><small>${open?done+' / 10':tx('locked')}</small></button>`;}).join('')}</div>${advert()}`;}
function levels(stage){currentStage=stage;screen='levels';ads('levels');app.innerHTML=header(true)+`<div class="eyebrow">${tx('stage',{n:stage+1})}</div><h1>${stageName(stage)}</h1><p>${esc(t('descriptions')[stage])}</p><div class="levels">${Array.from({length:10},(_,i)=>{let l=stage*10+i+1,open=l===1||saved.done.includes(l-1)||saved.done.includes(l);return `<button class="level ${saved.done.includes(l)?'done':''}" onclick="start(${l})" ${open?'':'disabled'} aria-label="${tx('level',{n:l})}${open?'':' · '+tx('locked')}">${l}<br><small>${saved.done.includes(l)?'✓':open?'•':'–'}</small></button>`;}).join('')}</div><div class="notice">${tx('progressHelp')}</div>${advert()}`;}
function rules(){screen='rules';ads('none');app.innerHTML=header(true)+`<h1>${tx('ruleTitle')}</h1><ol class="rules"><li>${tx('ruleClassic')}</li><li>${tx('ruleEven')}</li><li>${tx('ruleSum')}</li></ol><div class="notice">${tx('ruleControls')}</div><button class="primary wide" onclick="home()">${tx('understood')}</button>`;}
function start(level){if(level>1&&!saved.done.includes(level-1)&&!saved.done.includes(level))return home();p=E.generate(level);b=p.givens.slice();const active=saved.active;if(active&&active.level===level&&Array.isArray(active.board)&&active.board.length===b.length&&active.board.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=p.n&&(!p.givens[i]||p.givens[i]===v)))b=active.board.slice();history=[];selected=b.indexOf(0);screen='game';ads('none');saveGame();if(b.every(Boolean)&&b.every((v,i)=>v===p.solution[i]))return win();draw();}
function saveGame(){saved.active={level:p.level,board:b};persist();}
function draw(message=t('choose')){const filled=b.filter(Boolean).length;app.innerHTML=header(true)+`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${stageName(p.stage)}</div><h2 style="margin:8px 0">${tx('level',{n:p.level})}</h2></div><span class="pill"><bdi>${p.n} × ${p.n}</bdi></span></div><div class="progress"><div style="width:${filled/b.length*100}%"></div></div>${p.mode==='even'?'<div class="notice">☼ '+tx('pairGuide',{values:Array.from({length:Math.floor(p.n/2)},(_,i)=>(i+1)*2).join(', ')})+'</div>':p.mode==='sum'?'<div class="notice">'+tx('duoGuide')+' · <bdi>'+p.duos.map((d,i)=>String.fromCharCode(65+i)+' = '+d.total).join(' · ')+'</bdi></div>':''}<div class="board" dir="ltr" style="grid-template-columns:repeat(${p.n},1fr)" role="group" aria-label="${tx('grid')}">${b.map((v,i)=>{let duo=p.duos.findIndex(d=>d.a===i||d.b===i),marker=p.even.includes(i)?'P':duo>=0?String.fromCharCode(65+duo):'';return `<button onclick="selectCell(${i})" class="cell ${p.givens[i]?'given':'entered'} ${selected===i?'selected':''} ${duo>=0?'duo':''}" style="${(i%p.n+1)%p.w===0&&i%p.n!==p.n-1?'border-right:3px solid var(--grid-border,#315d50);':''}${(Math.floor(i/p.n)+1)%p.h===0&&i<p.n*(p.n-1)?'border-bottom:3px solid var(--grid-border,#315d50);':''}" aria-label="${tx('row')} ${Math.floor(i/p.n)+1}, ${tx('column')} ${i%p.n+1}, ${v||tx('empty')} ${marker} ${p.givens[i]?tx('fixed'):''}" aria-pressed="${selected===i}"><small>${marker}</small>${v||''}</button>`;}).join('')}</div><div class="keypad" dir="ltr">${Array.from({length:p.n},(_,i)=>`<button class="key" onclick="enter(${i+1})">${i+1}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="secondary" onclick="erase()">${tx('erase')}</button><button class="secondary" onclick="undo()" ${history.length?'':'disabled'}>${tx('undo')}</button><button class="secondary" onclick="hint()">☼ ${tx('hint')}</button></div><p class="message" role="status" aria-live="polite">${esc(message)}</p>`;}
function selectCell(i){selected=i;draw(t(p.givens[i]?'fixed':'yourTurn'));}
function enter(v){if(selected<0||p.givens[selected])return draw(t('choose'));let copy=b.slice();copy[selected]=0;if(!E.candidates(p,copy,selected).includes(v))return draw(t('conflict'));history.push(b.slice());b[selected]=v;saveGame();if(b.every(Boolean))return win();draw(t('continue'));}
function erase(){if(selected<0||p.givens[selected])return;history.push(b.slice());b[selected]=0;saveGame();draw();}
function undo(){if(history.length){b=history.pop();saveGame();draw(t('undone'));}}
function hint(){let wrong=b.findIndex((v,i)=>v&&v!==p.solution[i]);if(wrong>=0){selected=wrong;return draw(t('reconsider'));}let s=E.single(p,b);if(!s)return draw(t('filled'));history.push(b.slice());selected=s.i;b[s.i]=s.v;saveGame();if(b.every(Boolean))return win();draw(t('hintExplanation',{r:Math.floor(s.i/p.n)+1,c:s.i%p.n+1,v:s.v}));}
function win(){if(!saved.done.includes(p.level))saved.done.push(p.level);saved.active=null;persist();screen='win';ads(p.level%10===0?'milestone':'none');drawWin();}
function drawWin(){app.innerHTML=header()+`<section class="win"><div class="icon">✿</div><div class="eyebrow" style="margin-top:25px">${tx(p.level%10===0?'stageComplete':'success')}</div><h1>${tx('congratulations')}</h1><p>${tx('levelWon',{n:p.level})}<br>${tx(p.level===60?'allDone':p.level%10===0?'nextStageText':'nextText')}</p><button class="primary wide" onclick="${p.level===60?'home()':p.level%10===0?'levels('+Math.floor(p.level/10)+')':'start('+(p.level+1)+')'}">${tx(p.level===60?'review':p.level%10===0?'nextStage':'nextLevel')}</button><button class="secondary" style="margin-top:14px" onclick="home()">${tx('home')}</button>${p.level%10===0?advert():''}</section>`;}
document.addEventListener('keydown',e=>{if(screen!=='game'||['SELECT','INPUT','TEXTAREA'].includes(e.target?.tagName))return;if(/^[1-9]$/.test(e.key)&&Number(e.key)<=p.n)enter(Number(e.key));if(e.key==='Backspace'||e.key==='Delete')erase();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-p.n,ArrowDown:p.n}[e.key];selectCell(Math.max(0,Math.min(b.length-1,selected+d)));}});
applyTheme();L.apply();home();
</script></body></html>
