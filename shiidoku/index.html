<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174e45"><meta name="description" content="Shiidoku : 60 niveaux de sudoku pour petits et grands, avec cases paires, duos et indices gratuits."><title>Shiidoku — Sudoku pour tous</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183e38;background:#f7f7ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;color:inherit;border:0}button:disabled{cursor:default;opacity:.4}button:focus-visible{outline:3px solid #cd701e;outline-offset:3px}main{max-width:680px;margin:auto;padding:24px 22px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:850;font-size:24px;letter-spacing:-1px}.pill{background:#e8eddf;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:750}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:#5b7465}h1{font-size:clamp(38px,8vw,58px);line-height:1.08;letter-spacing:-2px;margin:17px 0}h2{letter-spacing:-.7px;font-size:25px}p{line-height:1.6;color:#51665e}.hero{position:relative;padding:15px 0 24px}.hero p{max-width:370px}.leaf{display:inline-block;background:#d7e4a3;border-radius:60% 10% 60% 10%;padding:8px 19px;transform:rotate(-6deg)}.primary{background:#174e45;color:white;padding:16px 22px;border-radius:16px;font-weight:750;min-height:52px}.wide{width:100%}.secondary{padding:13px 16px;background:#e7edde;border-radius:14px;min-height:48px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section{display:flex;justify-content:space-between;align-items:center;margin-top:23px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;text-align:left;border:1px solid #e0e7d8;border-radius:22px;padding:20px;min-height:160px}.card strong{display:block;font-size:18px;margin:13px 0 7px}.card small{line-height:1.5;display:block;color:#65776e}.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#e7edc8;font-size:21px}.ad{border:1px dashed #bac6b3;border-radius:13px;text-align:center;color:#71806f;padding:15px;margin-top:28px;font-size:11px;letter-spacing:1px}.sub{font-size:12px;color:#6f7e70}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:25px 0}.level{background:white;border:1px solid #d7e0ce;border-radius:16px;min-height:66px;font-weight:800}.done{background:#dce9b9}.board{display:grid;gap:0;border:3px solid #315d50;border-radius:12px;overflow:hidden;margin:22px auto;background:#315d50;max-width:480px}.cell{position:relative;aspect-ratio:1;border-radius:0;background:#fffef8;border-right:1px solid #d7dfcf;border-bottom:1px solid #d7dfcf;font-size:clamp(19px,5vw,30px);font-weight:650;min-width:0;padding:0}.cell.given{background:#edf0e3;color:#385447}.cell.entered{color:#246caf}.cell.selected{background:#d5e8b6;box-shadow:inset 0 0 0 3px #46744b}.cell small{position:absolute;left:3px;top:1px;font-size:9px;color:#875423}.cell.duo{background-image:linear-gradient(0deg,#f9dda870,transparent)}.keypad{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.key{background:#e3e9d6;min-height:49px;flex:1;border-radius:12px;font-size:22px;font-weight:700;max-width:55px;padding:0}.notice{padding:14px 17px;background:#eaf0de;border-radius:15px;font-size:14px;line-height:1.55;margin:14px 0}.message{min-height:52px;line-height:1.5;font-size:14px;color:#375b44}.progress{height:7px;background:#e2e8d6;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#84a44c}.win{text-align:center;padding:40px 0}.win .icon{margin:auto;width:85px;height:85px;font-size:44px}.rules li{line-height:1.7;margin-bottom:12px}.foot{margin-top:27px;font-size:12px;text-align:center;color:#738170}@media(max-width:370px){main{padding:16px 12px}.cards{gap:8px}.card{padding:14px}.cell small{font-size:8px}}@media(prefers-reduced-motion:no-preference){.card:hover,.primary:hover{transform:translateY(-2px);transition:transform .15s}}

</style></head><body><main id="app"></main><script>/* Shared, deterministic puzzle engine; also exercised in Node. */
(function(root){
const stages=[['Petites pousses',4,2,2,'classic','Un premier pas, tout en douceur.'],['Les lucioles',4,2,2,'even','Les cases P accueillent un nombre pair.'],['Duos malins',4,2,2,'sum','Deux voisins, une somme à retrouver.'],['Le grand jardin',6,2,3,'classic','Six chiffres pour élargir son horizon.'],['La forêt des liens',6,2,3,'sum','Additionne, observe, puis déduis.'],['Les étoiles',9,3,3,'even','Le grand sudoku, avec des repères pairs.']];
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function candidates(p,b,i){if(b[i])return [];const n=p.n,r=Math.floor(i/n),c=i%n,out=[];for(let v=1;v<=n;v++){
 if(p.even.includes(i)&&v%2)continue;let ok=true;
 for(let j=0;j<n;j++)if(b[r*n+j]===v||b[j*n+c]===v)ok=false;
 for(let y=r-r%p.h;y<r-r%p.h+p.h;y++)for(let x=c-c%p.w;x<c-c%p.w+p.w;x++)if(b[y*n+x]===v)ok=false;
 for(const d of p.duos)if(d.a===i||d.b===i){let o=d.a===i?d.b:d.a;if(b[o]?b[o]+v!==d.total:d.total-v<1||d.total-v>n||d.total-v===v)ok=false;}
 if(ok)out.push(v);
}return out;}
function count(p,board,limit=2){const b=board.slice();let total=0;function walk(){let best=-1,opts=[];for(let i=0;i<b.length;i++)if(!b[i]){let a=candidates(p,b,i);if(!a.length)return;if(best<0||a.length<opts.length){best=i;opts=a;}if(a.length===1)break;}if(best<0){total++;return;}for(const v of opts){b[best]=v;walk();if(total>=limit)break;}b[best]=0;}walk();return total;}
function single(p,b){for(let i=0;i<b.length;i++)if(!b[i]){const a=candidates(p,b,i);if(a.length===1)return {i,v:a[0]};}return null;}
function logical(p,b){b=b.slice();while(b.includes(0)){let s=single(p,b);if(!s)return false;b[s.i]=s.v;}return true;}
function generate(level){if(!Number.isInteger(level)||level<1||level>60)throw Error('Invalid level');const stage=Math.floor((level-1)/10),[name,n,h,w,mode]=stages[stage],r=rng(level*7919),digits=shuffle(Array.from({length:n},(_,i)=>i+1),r);
 const rows=shuffle(Array.from({length:n/h},(_,i)=>i),r).flatMap(g=>shuffle(Array.from({length:h},(_,i)=>g*h+i),r));
 const cols=shuffle(Array.from({length:n/w},(_,i)=>i),r).flatMap(g=>shuffle(Array.from({length:w},(_,i)=>g*w+i),r));
 const solution=rows.flatMap(y=>cols.map(x=>digits[(y*w+Math.floor(y/h)+x)%n]));
 const p={level,stage,name,n,h,w,mode,solution,even:[],duos:[]};
 if(mode==='even')p.even=shuffle(solution.map((v,i)=>v%2===0?i:-1).filter(i=>i>=0),r).slice(0,n);
 if(mode==='sum')for(let y=0;y<n;y++){let x=Math.floor(r()*(n-1));let a=y*n+x;p.duos.push({a,b:a+1,total:solution[a]+solution[a+1]});}
 p.givens=solution.slice();let removed=0,target=Math.floor(n*n*(0.36+((level-1)%10)*0.025));
 for(const i of shuffle(Array.from({length:n*n},(_,i)=>i),r)){let old=p.givens[i];p.givens[i]=0;if(logical(p,p.givens))removed++;else p.givens[i]=old;if(removed>=target)break;}
 return p;
}
const api={stages,generate,candidates,count,single,logical};if(typeof module!=='undefined')module.exports=api;else root.Shiidoku=api;
})(this);
</script><script>const E=Shiidoku,app=document.getElementById('app');let saved={done:[],active:null};try{let s=JSON.parse(localStorage.getItem('shiidoku-v1'));if(s&&Array.isArray(s.done)){saved.done=s.done.filter(n=>Number.isInteger(n)&&n>0&&n<=60);saved.active=s.active;}}catch(e){}
let p,b,selected=-1,history=[],screen='home',currentStage=0;
function persist(){try{localStorage.setItem('shiidoku-v1',JSON.stringify(saved));}catch(e){}}
function ads(place){if(window.Android)Android.setAdPlacement(place);}
function header(back=false){return `<header class="top"><${back?'button onclick="home()"':'div'} class="brand">${back?'← ':''}Shiidoku<span style="color:#89a35a">.</span></${back?'button':'div'}><span class="pill">${saved.done.length} / 60 réussis</span></header>`;}
function advert(){return '';}
function home(){screen='home';ads('home');let next=Array.from({length:60},(_,i)=>i+1).find(i=>!saved.done.includes(i))||60;app.innerHTML=header()+`<section class="hero"><div class="eyebrow">Un petit défi, un grand sourire</div><h1>La logique<br>prend <span class="leaf">vie.</span></h1><p>Des chiffres, des liens et des déclics.<br>Un jardin de défis pour petits et grands.</p><button class="primary wide" onclick="start(${saved.active?.level||next})">${saved.active?'Reprendre ma partie':'C’est parti · Niveau '+next} →</button><div class="foot">À ton rythme · Indices gratuits · Sauvegarde automatique</div></section><div class="section"><h2>Ton aventure</h2><button class="secondary" onclick="rules()">Les règles</button></div><div class="cards">${E.stages.map((s,i)=>{let done=saved.done.filter(l=>Math.floor((l-1)/10)===i).length,open=i===0||saved.done.includes(i*10);return `<button class="card" ${open?'':'disabled'} onclick="levels(${i})"><span class="icon">${['✿','☼','∞','♧','◇','☆'][i]}</span><strong>${s[0]}</strong><small>${s[1]} × ${s[1]} · ${['Classique','Cases paires','Duos sommes','Classique','Duos sommes','Cases paires'][i]}</small><small>${open?done+' / 10 niveaux':'Termine le palier précédent'}</small></button>`;}).join('')}</div>${advert()}`;}
function levels(stage){currentStage=stage;screen='levels';ads('levels');let s=E.stages[stage];app.innerHTML=header(true)+`<div class="eyebrow">Palier ${stage+1} sur 6</div><h1>${s[0]}</h1><p>${s[5]}</p><div class="levels">${Array.from({length:10},(_,i)=>{let l=stage*10+i+1,open=l===1||saved.done.includes(l-1)||saved.done.includes(l);return `<button class="level ${saved.done.includes(l)?'done':''}" onclick="start(${l})" ${open?'':'disabled'} aria-label="Niveau ${l}${open?'':' verrouillé'}">${l}<br><small>${saved.done.includes(l)?'✓':open?'•':'–'}</small></button>`;}).join('')}</div><div class="notice">Chaque niveau terminé ouvre le suivant. Tu peux rejouer tous les niveaux déjà réussis.</div>${advert()}`;}
function rules(){screen='rules';ads('none');app.innerHTML=header(true)+`<h1>Un chiffre.<br>Une place.</h1><ol class="rules"><li><b>Chaque chiffre une seule fois</b> dans chaque ligne, colonne et bloc à bord épais. De 1 à 4, 6 ou 9 selon la grille.</li><li><b>Les lucioles P :</b> une case marquée P doit contenir un nombre pair : 2, 4, 6 ou 8.</li><li><b>Les duos :</b> les deux cases voisines marquées A, B, C… doivent donner la somme indiquée. Par exemple, A = 5 peut être 1 + 4 ou 2 + 3.</li></ol><div class="notice">Touche une case, puis un chiffre. Une erreur ? Efface ou annule. « Indice » remplit une case et explique pourquoi. Aucun compte à rebours, aucune vie à perdre.</div><button class="primary wide" onclick="home()">J’ai compris</button>`;}
function start(level){if(level>1&&!saved.done.includes(level-1)&&!saved.done.includes(level))return home();p=E.generate(level);b=p.givens.slice();const active=saved.active;if(active&&active.level===level&&Array.isArray(active.board)&&active.board.length===b.length&&active.board.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=p.n&&(!p.givens[i]||p.givens[i]===v)))b=active.board.slice();history=[];selected=b.indexOf(0);screen='game';ads('none');saveGame();draw();}
function saveGame(){saved.active={level:p.level,board:b};persist();}
function draw(message='Choisis une case vide, puis un chiffre.'){const filled=b.filter(Boolean).length;app.innerHTML=header(true)+`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${p.name}</div><h2 style="margin:8px 0">Niveau ${p.level}</h2></div><span class="pill">${p.n} × ${p.n}</span></div><div class="progress"><div style="width:${filled/b.length*100}%"></div></div>${p.mode==='even'?'<div class="notice">☼ Les cases P sont paires : '+Array.from({length:Math.floor(p.n/2)},(_,i)=>(i+1)*2).join(', ')+'.</div>':p.mode==='sum'?'<div class="notice">Duos voisins · '+p.duos.map((d,i)=>String.fromCharCode(65+i)+' = '+d.total).join(' · ')+'</div>':''}<div class="board" style="grid-template-columns:repeat(${p.n},1fr)" role="group" aria-label="Grille de sudoku">${b.map((v,i)=>{let duo=p.duos.findIndex(d=>d.a===i||d.b===i),marker=p.even.includes(i)?'P':duo>=0?String.fromCharCode(65+duo):'';return `<button onclick="selectCell(${i})" class="cell ${p.givens[i]?'given':'entered'} ${selected===i?'selected':''} ${duo>=0?'duo':''}" style="${(i%p.n+1)%p.w===0&&i%p.n!==p.n-1?'border-right:3px solid #315d50;':''}${(Math.floor(i/p.n)+1)%p.h===0&&i<p.n*(p.n-1)?'border-bottom:3px solid #315d50;':''}" aria-label="Ligne ${Math.floor(i/p.n)+1}, colonne ${i%p.n+1}, ${v||'vide'} ${marker} ${p.givens[i]?'fixe':''}" aria-pressed="${selected===i}"><small>${marker}</small>${v||''}</button>`;}).join('')}</div><div class="keypad">${Array.from({length:p.n},(_,i)=>`<button class="key" onclick="enter(${i+1})">${i+1}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="secondary" onclick="erase()">Effacer</button><button class="secondary" onclick="undo()" ${history.length?'':'disabled'}>Annuler</button><button class="secondary" onclick="hint()">☼ Indice</button></div><p class="message" role="status" aria-live="polite">${message}</p>`;}
function selectCell(i){selected=i;draw(p.givens[i]?'Ce chiffre est un repère fixe.':'À toi de jouer.');}
function enter(v){if(selected<0||p.givens[selected])return draw('Choisis d’abord une case vide.');let copy=b.slice();copy[selected]=0;if(!E.candidates(p,copy,selected).includes(v))return draw('Ce chiffre ne respecte pas la ligne, la colonne, le bloc ou le repère de cette case. Essaie encore !');history.push(b.slice());b[selected]=v;saveGame();if(b.every(Boolean))return win();draw('Bien joué, continue à observer !');}
function erase(){if(selected<0||p.givens[selected])return;history.push(b.slice());b[selected]=0;saveGame();draw();}
function undo(){if(history.length){b=history.pop();saveGame();draw('Dernière action annulée.');}}
function hint(){let wrong=b.findIndex((v,i)=>v&&v!==p.solution[i]);if(wrong>=0){selected=wrong;return draw('Reviens sur cette case : ce choix empêche de terminer la grille. Efface-la puis observe les repères.');}let s=E.single(p,b);if(!s)return draw('La grille est déjà remplie.');history.push(b.slice());selected=s.i;b[s.i]=s.v;saveGame();if(b.every(Boolean))return win();draw(`Ligne ${Math.floor(s.i/p.n)+1}, colonne ${s.i%p.n+1} : seul ${s.v} est possible après avoir éliminé les chiffres de la ligne, de la colonne, du bloc et appliqué les repères éventuels.`);}
function win(){if(!saved.done.includes(p.level))saved.done.push(p.level);saved.active=null;persist();screen='win';ads(p.level%10===0?'milestone':'none');app.innerHTML=header()+`<section class="win"><div class="icon">✿</div><div class="eyebrow" style="margin-top:25px">${p.level%10===0?'Palier terminé':'Un nouveau déclic'}</div><h1>${p.level===60?'Quelle aventure !':'Bravo à toi !'}</h1><p>Niveau ${p.level} réussi.<br>${p.level===60?'Les 60 défis sont dans ton jardin.':p.level%10===0?'Un nouveau jardin de défis t’attend.':'Chaque petit pas fait grandir ta logique.'}</p><button class="primary wide" onclick="${p.level===60?'home()':p.level%10===0?'levels('+Math.floor(p.level/10)+')':'start('+(p.level+1)+')'}">${p.level===60?'Revoir mes paliers':p.level%10===0?'Découvrir le prochain palier':'Niveau suivant →'}</button><button class="secondary" style="margin-top:14px" onclick="home()">Accueil</button>${p.level%10===0?advert():''}</section>`;}
document.addEventListener('keydown',e=>{if(screen!=='game')return;if(/^[1-9]$/.test(e.key)&&Number(e.key)<=p.n)enter(Number(e.key));if(e.key==='Backspace'||e.key==='Delete')erase();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-p.n,ArrowDown:p.n}[e.key];selectCell(Math.max(0,Math.min(b.length-1,selected+d)));}});home();
</script></body></html>
